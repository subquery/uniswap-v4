version: "3"

services:
  postgres:
    build:
      context: .
      dockerfile: ./docker/pg-Dockerfile
    expose:
      - "5432"
    # ports:
    #   - 5433:5432
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  subquery-node:
    image: subquerynetwork/subql-node-ethereum:latest
    depends_on:
      "postgres":
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./:/app
    command:
      # - ${SUB_COMMAND:-} # set SUB_COMMAND env variable to "test" to run tests
      # - reindex
      # - --targetHeight=49052351
      - -f=/app
      - --db-schema=app
      # - --workers=4
      - --batch-size=10
      - --unfinalized-blocks=true
      - --network-endpoint="https://eth.api.onfinality.io/rpc?apikey=b8b99961-e876-41dd-bd7d-0c143f3a3428"
      # - --network-endpoint="https://rpc.xlayer.tech"
      # - --network-dictionary="http://host.docker.internal:8080/ethereum-mainnet"
      # - --dictionary-registry="false"
      # - --debug="dictionary-v2"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://subquery-node:3000/ready"]
      interval: 3s
      timeout: 5s
      retries: 10

  graphql-engine:
    image: subquerynetwork/subql-query:latest
    ports:
      - 3000:3000
    depends_on:
      "postgres":
        condition: service_healthy
      "subquery-node":
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
    command:
      - --name=app
      - --playground
      - --indexer=http://subquery-node:3000
